name: 'klaviyo_source'
profile: 'databricks'
version: '0.9.0'
config-version: 2
require-dbt-version: [">=1.0.0", "<2.0.0"]

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

vars:
  # namespaced so the root project's klaviyo_schema doesn't overwrite these
  klaviyo_source_database: 0006_wsg
  klaviyo_source_schema: klaviyo_raw

  # Airbyte table names (override here if yours differ)
  klaviyo_event_identifier: events
  klaviyo_person_identifier: profiles
  klaviyo_campaign_identifier: campaigns_detailed
  klaviyo_flow_identifier: flows
  klaviyo_metric_identifier: metrics
  klaviyo_list_identifier: lists

  klaviyo__event_pass_through_columns: []
  klaviyo__person_pass_through_columns: []

model-paths: ["models"]
packages-install-path: "dbt_packages"

models:
  +materialized: table
  klaviyo_source:
    +schema: default_stg_klaviyo    # where *staging* outputs land