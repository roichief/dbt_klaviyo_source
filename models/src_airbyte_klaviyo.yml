version: 2

sources:
  - name: klaviyo_source
    database: "{{ var('klaviyo_database') }}"   # 0006_wsg
    schema: "{{ var('klaviyo_schema') }}"       # klaviyo_raw
    tables:
      - name: campaigns
        identifier: "{{ var('klaviyo_campaign_identifier', 'campaigns') }}"
      - name: events
        identifier: "{{ var('klaviyo_event_identifier', 'events') }}"
      - name: flows
        identifier: "{{ var('klaviyo_flow_identifier', 'flows') }}"
      - name: metrics
        identifier: "{{ var('klaviyo_metric_identifier', 'metrics') }}"
      - name: profiles          # <-- this was missing
        identifier: "{{ var('klaviyo_person_identifier', 'profiles') }}"
      - name: lists
        identifier: "{{ var('klaviyo_list_identifier', 'lists') }}"
