version: 2

sources:
  - name: klaviyo_source
    database: "{{ var('klaviyo_source_database') }}"
    schema: "{{ var('klaviyo_source_schema') }}"
    tables:
      - name: campaigns
        identifier: "{{ var('klaviyo_campaign_identifier', 'campaigns_detailed') }}"
      - name: events
        identifier: "{{ var('klaviyo_event_identifier', 'events') }}"
      - name: flows
        identifier: "{{ var('klaviyo_flow_identifier', 'flows') }}"
      - name: metrics
        identifier: "{{ var('klaviyo_metric_identifier', 'metrics') }}"
      - name: profiles
        identifier: "{{ var('klaviyo_person_identifier', 'profiles') }}"
      - name: lists
        identifier: "{{ var('klaviyo_list_identifier', 'lists') }}"
